[project]
name = "nextron-cloud"
dynamic = ["version"]
description = "Official Python client for the NexTron Cloud fine-tuning API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Physion Labs", email = "support@physionlabs.ai" }]
keywords = ["nextron", "physion", "fine-tuning", "training"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# Upper bounds at the next major: an unbounded httpx once resolved to a 1.0 dev release that broke Client().
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.scripts]
nextron-cloud = "nextron_cloud.cli:main"

[project.urls]
Homepage = "https://nextron.physionlabs.ai"
Issues = "https://github.com/Physion-Labs/nextron-python/issues"

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nextron_cloud/_version.py"

[tool.hatch.build.targets.sdist]
only-include = ["src", "skills", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/nextron_cloud"]

# The agent guide ships inside the package: `nextron-cloud guide` prints it after a plain pip install.
[tool.hatch.build.targets.wheel.force-include]
"skills/nextron-cloud" = "nextron_cloud/guide"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/nextron_cloud"]
